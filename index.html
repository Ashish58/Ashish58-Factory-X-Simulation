<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Factory X - Industrial Portal</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #020617;
      color: white;
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      background: url('assets/factory-bg.png') center/cover no-repeat;
      opacity: 0.35;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(30,58,138,0.3), transparent 70%);
      z-index: 1;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(2,6,23,0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header-left {
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .header-right {
      display: flex;
      gap: 12px;
      font-size: 11px;
      opacity: 0.7;
      align-items: center;
    }

    /* MAIN */
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px 90px;
    }

    @media (min-width: 768px) {
      main {
        justify-content: center;
        padding: 40px;
      }
    }

    /* HERO */
    #hero {
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: 0.8s ease;
    }

    #hero.show {
      opacity: 1;
      transform: translateY(0);
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(to bottom right, #1e3a8a, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      margin-bottom: 16px;
      box-shadow: 0 0 40px rgba(37,99,235,0.3);
    }

    h1 {
      font-size: 28px;
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 48px;
      }
    }

    .subtitle {
      margin-top: 10px;
      font-size: 12px;
      color: #93c5fd;
      opacity: 0.7;
    }

    /* FEATURES */
    #features {
      margin-top: 30px;
      display: grid;
      gap: 20px;
      width: 100%;
      max-width: 900px;
      opacity: 0;
      transition: 1s ease;
    }

    #features.show {
      opacity: 1;
    }

    @media (min-width: 768px) {
      #features {
        grid-template-columns: repeat(3, 1fr);
        margin-top: 50px;
      }
    }

    .card {
      text-align: center;
      padding: 20px;
    }

    .icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(30,58,138,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      margin-bottom: 10px;
    }

    /* CTA */
    #cta {
      margin-top: 30px;
      width: 100%;
      max-width: 320px;
      opacity: 0;
      transform: translateY(20px);
      transition: 1s ease;
    }

    #cta.show {
      opacity: 1;
      transform: translateY(0);
    }

    button {
      width: 100%;
      background: #2563eb;
      border: none;
      padding: 14px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1d4ed8;
      box-shadow: 0 0 20px rgba(37,99,235,0.5);
    }

    /* FOOTER */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(2,6,23,0.9);
      text-align: center;
      padding: 10px;
      font-size: 10px;
      opacity: 0.6;
    }

  </style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<!-- HEADER -->
<header>
  <div class="header-left">Factory X</div>
  <div class="header-right">
    <span id="time"></span>
    <span>Admin</span>
  </div>
</header>

<main>

  <!-- HERO -->
  <div id="hero">
    <div class="logo">
      <img src="assets/factory-logo.png" width="40">
    </div>

    <h1>Factory X Dashboard</h1>
    <p class="subtitle">Monitor production, energy & dispatch</p>
  </div>

  <!-- FEATURES -->
  <div id="features">
    <div class="card">
      <div class="icon">🏭</div>
      <h3>Production</h3>
      <p>Track production performance</p>
    </div>

    <div class="card">
      <div class="icon">⚡</div>
      <h3>Energy</h3>
      <p>Monitor energy usage</p>
    </div>

    <div class="card">
      <div class="icon">🚚</div>
      <h3>Dispatch</h3>
      <p>Track dispatch status</p>
    </div>
  </div>

  <!-- CTA -->
  <div id="cta">
    <button onclick="window.location.href='dashboard.html'">
      Enter Dashboard
    </button>
  </div>

</main>

<footer>
  © 2026 This is a simulation dashboard <b>Factory X</b>
</footer>

<script>
  // Animation
  window.addEventListener("load", () => {
    setTimeout(() => hero.classList.add("show"), 200);
    setTimeout(() => features.classList.add("show"), 600);
    setTimeout(() => cta.classList.add("show"), 900);
  });

  // Live Time
  function updateTime() {
    const now = new Date();
    document.getElementById("time").innerText =
      now.toLocaleTimeString();
  }
  setInterval(updateTime, 1000);
  updateTime();
</script>

</body>
</html>
